<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hell Info - Ooredoo Token Extractor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 30px; max-width: 400px; width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); text-align: center;
        }
        .logo { font-size: 28px; font-weight: bold; color: #ff2d55; margin-bottom: 10px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 16px; outline: none;
        }
        input:focus { border-color: #ff2d55; }
        button {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: linear-gradient(90deg, #ff2d55, #ff6b6b); color: #fff;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .hidden { display: none !important; }
        .alert { padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 14px; }
        .alert-error { background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid rgba(255,0,0,0.3); }
        .alert-success { background: rgba(0,255,100,0.1); color: #00ff64; border: 1px solid rgba(0,255,100,0.3); }
        .token-box {
            margin-top: 15px; background: #000; border-radius: 10px; padding: 15px;
            text-align: left; word-break: break-all; font-family: monospace; font-size: 11px;
            color: #00ff64; max-height: 150px; overflow-y: auto;
        }
        .copy-btn { background: #ff2d55; margin-top: 10px; padding: 10px; font-size: 14px; }
        .footer { margin-top: 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Hell Info</div>
        <div class="subtitle">استخراج توكن أوريدو الرسمي</div>

        <!-- الخطوة 1 -->
        <div id="step1">
            <div class="form-group">
                <label>رقم أوريدو (بدون 0 في البداية)</label>
                <input type="tel" id="phone" placeholder="561843626" maxlength="9">
            </div>
            <button onclick="sendOTP()" id="btnSend">📤 إرسال OTP</button>
        </div>

        <!-- الخطوة 2 -->
        <div id="step2" class="hidden">
            <div class="form-group">
                <label>رمز OTP (6 أرقام)</label>
                <input type="number" id="otp" placeholder="123456" maxlength="6">
            </div>
            <button onclick="verifyOTP()" id="btnVerify">✅ تحقق واستخرج التوكن</button>
        </div>

        <div id="alert" class="alert hidden"></div>

        <div id="tokenBox" class="hidden">
            <div class="token-box" id="tokenText"></div>
            <button class="copy-btn" onclick="copyToken()">📋 نسخ التوكن</button>
        </div>

        <div class="footer">By FaresCodeX 🖋</div>
    </div>

    <script>
        // ⚠️ ضع رابط السيرفر هنا (من Render.com بعد النشر)
        const API = "https://ooredoo-tasjil.onrender.com";
        
        let deviceData = { iid: "", psig: "" };
        let currentToken = "";

        function genDevice() {
            const uuid = crypto.randomUUID();
            deviceData.iid = `${uuid}${Date.now()}`;
            deviceData.psig = btoa(JSON.stringify({
                platform: "android", "is-physical-device": true, "device-id": deviceData.iid
            }));
        }

        function showAlert(type, msg) {
            const a = document.getElementById('alert');
            a.className = `alert alert-${type}`;
            a.textContent = msg;
            a.classList.remove('hidden');
        }

        async function sendOTP() {
            const phone = document.getElementById('phone').value.trim();
            if (!/^\d{9}$/.test(phone)) return showAlert('error', '❌ رقم غير صحيح (9 أرقام بدون 0)');

            genDevice();
            const btn = document.getElementById('btnSend');
            btn.disabled = true; btn.textContent = '⏳ جاري الإرسال...';

            try {
                const res = await fetch(`${API}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msisdn: "213" + phone, ...deviceData })
                });
                const data = await res.json();
                
                if (data.success) {
                    showAlert('success', '✅ تم إرسال OTP! تحقق من هاتفك.');
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else {
                    showAlert('error', '❌ فشل: ' + (data.error || 'unknown'));
                    btn.disabled = false; btn.textContent = '📤 إعادة الإرسال';
                }
            } catch (e) {
                showAlert('error', '❌ فشل الاتصال بالسيرفر');
                btn.disabled = false; btn.textContent = '📤 إعادة الإرسال';
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value.trim();
            if (!/^\d{6}$/.test(otp)) return showAlert('error', '❌ OTP يجب أن يكون 6 أرقام');

            const phone = document.getElementById('phone').value.trim();
            const btn = document.getElementById('btnVerify');
            btn.disabled = true; btn.textContent = '⏳ جاري التحقق...';

            try {
                const res = await fetch(`${API}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msisdn: "213" + phone, otp, ...deviceData })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    showAlert('success', '🎉 تم استخراج التوكن! انسخه والصقه في البوت.');
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('tokenBox').classList.remove('hidden');
                    document.getElementById('tokenText').textContent = data.token;
                    currentToken = data.token;
                } else {
                    showAlert('error', '❌ OTP خاطئ أو منتهي');
                    btn.disabled = false; btn.textContent = '✅ إعادة المحاولة';
                }
            } catch (e) {
                showAlert('error', '❌ فشل الاتصال بالسيرفر');
                btn.disabled = false; btn.textContent = '✅ إعادة المحاولة';
            }
        }

        function copyToken() {
            navigator.clipboard.writeText(currentToken).then(() => {
                showAlert('success', '✅ تم نسخ التوكن! الصقه في البوت (@Yooz619Bot).');
            });
        }
    </script>
</body>
</html>
